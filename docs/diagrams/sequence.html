<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InvestorHub — Sequence Diagram</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#f8fafc; color:#111827; font-family:"Segoe UI",Arial,sans-serif; }
    .page { max-width:1100px; margin:0 auto; padding:28px 20px 48px; }
    header { text-align:center; margin-bottom:8px; }
    h1 { margin:0; font-size:26px; }
    .subtitle { margin:6px 0 0; color:#4b5563; font-size:14px; }
    .toolbar { display:flex; justify-content:center; margin:16px 0 20px; }
    button { border:1px solid #cbd5e1; background:#fff; padding:8px 14px; border-radius:8px; cursor:pointer; }
    button:hover { background:#f1f5f9; }
    .board { background:#fff; border:1px solid #e2e8f0; border-radius:12px; overflow:auto; padding:12px; }
    svg { display:block; width:100%; height:auto; }
    .notes { margin-top:22px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:14px 16px; }
    .card h2 { margin:0 0 8px; font-size:14px; }
    .card ul { margin:0; padding-left:18px; color:#4b5563; font-size:13px; line-height:1.55; }
    @media print {
      body { background:#fff; }
      .toolbar { display:none; }
      .page { max-width:none; padding:0; }
      .board { border:none; }
      @page { size:A3 landscape; margin:10mm; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>InvestorHub — Sequence Diagram</h1>
      <p class="subtitle">Simple overall flow · User → Frontend → API → Database</p>
    </header>
    <div class="toolbar"><button onclick="window.print()">Print / Save as PDF</button></div>

    <div class="board">
      <svg viewBox="0 0 1000 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="InvestorHub Sequence Diagram">
    <style>
      text {
        font-family: "Segoe UI", Arial, sans-serif;
        font-weight: 700;
        stroke: #ffffff;
        stroke-width: 3.2px;
        paint-order: stroke fill;
        stroke-linejoin: round;
      }
    </style>

        <defs>
          <marker id="arr" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
            <path d="M0 0 L8 3.5 L0 7 Z" fill="#111827"/>
          </marker>
          <marker id="ret" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
            <path d="M0 0 L8 3.5 L0 7 Z" fill="#1e293b"/>
          </marker>
        </defs>

        <text x="500" y="32" text-anchor="middle" font-size="24" font-weight="700">OVERALL SEQUENCE DIAGRAM</text>

        <rect x="30" y="50" width="120" height="40" fill="#fff" stroke="#111827"/>
        <text x="90" y="71" text-anchor="middle" font-size="18" font-weight="700">User</text>
        <rect x="220" y="50" width="130" height="40" fill="#fff" stroke="#111827"/>
        <text x="285" y="71" text-anchor="middle" font-size="18" font-weight="700">Frontend</text>
        <rect x="420" y="50" width="120" height="40" fill="#fff" stroke="#111827"/>
        <text x="480" y="71" text-anchor="middle" font-size="18" font-weight="700">API Server</text>
        <rect x="610" y="50" width="120" height="40" fill="#fff" stroke="#111827"/>
        <text x="670" y="71" text-anchor="middle" font-size="18" font-weight="700">Database</text>
        <rect x="800" y="50" width="100" height="40" fill="#fff" stroke="#111827"/>
        <text x="850" y="71" text-anchor="middle" font-size="18" font-weight="700">Admin</text>

        <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4">
          <line x1="90" y1="82" x2="90" y2="820"/>
          <line x1="285" y1="82" x2="285" y2="820"/>
          <line x1="480" y1="82" x2="480" y2="820"/>
          <line x1="670" y1="82" x2="670" y2="820"/>
          <line x1="850" y1="82" x2="850" y2="820"/>
        </g>

        <!-- REGISTRATION -->
        <rect x="20" y="100" width="960" height="16" fill="#f3f4f6"/>
        <text x="500" y="112" text-anchor="middle" font-size="16" font-weight="700">REGISTRATION &amp; APPROVAL</text>

        <line x1="90" y1="130" x2="285" y2="130" stroke="#111827" marker-end="url(#arr)"/>
        <text x="188" y="124" text-anchor="middle" font-size="16">1. Register</text>
        <line x1="285" y1="155" x2="480" y2="155" stroke="#111827" marker-end="url(#arr)"/>
        <text x="382" y="149" text-anchor="middle" font-size="16">2. POST /auth/register</text>
        <line x1="480" y1="180" x2="670" y2="180" stroke="#111827" marker-end="url(#arr)"/>
        <text x="575" y="174" text-anchor="middle" font-size="16">3. Save user (pending)</text>
        <line x1="670" y1="205" x2="90" y2="205" stroke="#4b5563" stroke-dasharray="4 3" marker-end="url(#ret)"/>
        <text x="380" y="199" text-anchor="middle" font-size="16">4. Pending page shown</text>

        <line x1="850" y1="230" x2="285" y2="230" stroke="#111827" marker-end="url(#arr)"/>
        <text x="568" y="224" text-anchor="middle" font-size="16">5. Approve user</text>
        <line x1="285" y1="255" x2="480" y2="255" stroke="#111827" marker-end="url(#arr)"/>
        <text x="382" y="249" text-anchor="middle" font-size="16">6. PUT status = active</text>
        <line x1="480" y1="280" x2="670" y2="280" stroke="#111827" marker-end="url(#arr)"/>
        <text x="575" y="274" text-anchor="middle" font-size="16">7. Update user</text>
        <line x1="670" y1="305" x2="90" y2="305" stroke="#4b5563" stroke-dasharray="4 3" marker-end="url(#ret)"/>
        <text x="380" y="299" text-anchor="middle" font-size="16">8. Account active</text>

        <!-- POST & MATCH -->
        <rect x="20" y="325" width="960" height="16" fill="#f3f4f6"/>
        <text x="500" y="337" text-anchor="middle" font-size="16" font-weight="700">POST &amp; MATCH</text>

        <line x1="90" y1="355" x2="285" y2="355" stroke="#111827" marker-end="url(#arr)"/>
        <text x="188" y="349" text-anchor="middle" font-size="16">9. Create post</text>
        <line x1="285" y1="380" x2="670" y2="380" stroke="#111827" marker-end="url(#arr)"/>
        <text x="478" y="374" text-anchor="middle" font-size="16">10. POST /posts → Save post</text>

        <line x1="90" y1="410" x2="285" y2="410" stroke="#111827" marker-end="url(#arr)"/>
        <text x="188" y="404" text-anchor="middle" font-size="16">11. Send match request</text>
        <line x1="285" y1="435" x2="670" y2="435" stroke="#111827" marker-end="url(#arr)"/>
        <text x="478" y="429" text-anchor="middle" font-size="16">12. POST /matches → Save (pending)</text>

        <line x1="90" y1="465" x2="285" y2="465" stroke="#111827" marker-end="url(#arr)"/>
        <text x="188" y="459" text-anchor="middle" font-size="16">13. Accept match</text>
        <line x1="285" y1="490" x2="670" y2="490" stroke="#111827" marker-end="url(#arr)"/>
        <text x="478" y="484" text-anchor="middle" font-size="16">14. PUT accept → Update status</text>
        <line x1="670" y1="515" x2="90" y2="515" stroke="#4b5563" stroke-dasharray="4 3" marker-end="url(#ret)"/>
        <text x="380" y="509" text-anchor="middle" font-size="16">15. Match accepted</text>

        <!-- CHAT & PAYMENT -->
        <rect x="20" y="535" width="960" height="16" fill="#f3f4f6"/>
        <text x="500" y="547" text-anchor="middle" font-size="16" font-weight="700">CHAT &amp; PAYMENT</text>

        <line x1="90" y1="565" x2="285" y2="565" stroke="#111827" marker-end="url(#arr)"/>
        <text x="188" y="559" text-anchor="middle" font-size="16">16. Send chat message</text>
        <line x1="285" y1="590" x2="670" y2="590" stroke="#111827" marker-end="url(#arr)"/>
        <text x="478" y="584" text-anchor="middle" font-size="16">17. Socket.IO → Save message</text>
        <line x1="670" y1="615" x2="90" y2="615" stroke="#4b5563" stroke-dasharray="4 3" marker-end="url(#ret)"/>
        <text x="380" y="609" text-anchor="middle" font-size="16">18. Message delivered</text>

        <line x1="90" y1="645" x2="285" y2="645" stroke="#111827" marker-end="url(#arr)"/>
        <text x="188" y="639" text-anchor="middle" font-size="16">19. Make payment</text>
        <line x1="285" y1="670" x2="670" y2="670" stroke="#111827" marker-end="url(#arr)"/>
        <text x="478" y="664" text-anchor="middle" font-size="16">20. SSLCommerz → Save payment</text>
        <line x1="670" y1="695" x2="90" y2="695" stroke="#4b5563" stroke-dasharray="4 3" marker-end="url(#ret)"/>
        <text x="380" y="689" text-anchor="middle" font-size="16">21. Payment successful</text>
      </svg>
    </div>

    <div class="notes">
      <div class="card">
        <h2>Flow summary</h2>
        <ul>
          <li><b>1–4:</b> Register → pending account.</li>
          <li><b>5–8:</b> Admin approves → account active.</li>
          <li><b>9–15:</b> Create post → match request → accept.</li>
          <li><b>16–21:</b> Chat (Socket.IO) → payment (SSLCommerz).</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
